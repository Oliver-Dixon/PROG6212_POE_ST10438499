name: Validate repository structure

# Runs on every push and pull request (any branch), and can be started manually
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Check /docs and README
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: /docs folder exists
        run: |
          if [ ! -d docs ]; then
            echo "::error::The /docs folder is missing."
            exit 1
          fi
          echo "OK: /docs folder found"

      - name: ERD image exists (PNG or PDF)
        run: |
          erd=$(find docs -maxdepth 1 -type f -iname '*erd*' \( -iname '*.png' -o -iname '*.pdf' \) | head -n 1)
          if [ -z "$erd" ]; then
            echo "::error::No ERD found. Add a PNG or PDF with 'ERD' in its file name to /docs."
            exit 1
          fi
          echo "OK: ERD found -> $erd"

      - name: API endpoint plan exists (Markdown or PDF)
        run: |
          plan=$(find docs -maxdepth 1 -type f -iname '*endpoint*' \( -iname '*.md' -o -iname '*.pdf' \) | head -n 1)
          if [ -z "$plan" ]; then
            echo "::error::No endpoint plan found. Add a .md or .pdf with 'Endpoint' in its file name to /docs."
            exit 1
          fi
          echo "OK: Endpoint plan found -> $plan"

      - name: SQL script exists and is complete
        run: |
          sql=$(find docs -maxdepth 1 -type f -iname '*.sql' | head -n 1)
          if [ -z "$sql" ]; then
            echo "::error::No .sql script found in /docs."
            exit 1
          fi
          tables=$(grep -ci 'CREATE TABLE' "$sql" || true)
          if [ "$tables" -lt 6 ]; then
            echo "::error::$sql has $tables CREATE TABLE statements; at least 6 entities are required."
            exit 1
          fi
          for keyword in 'PRIMARY KEY' 'FOREIGN KEY' 'INSERT INTO'; do
            if ! grep -qi "$keyword" "$sql"; then
              echo "::error::$sql does not contain '$keyword'."
              exit 1
            fi
          done
          echo "OK: $sql has $tables tables, keys and seed data"

      - name: README describes the system and both roles
        run: |
          if [ ! -s README.md ]; then
            echo "::error::README.md is missing or empty."
            exit 1
          fi
          for role in Organiser Participant; do
            if ! grep -qi "$role" README.md; then
              echo "::error::README.md does not describe the $role role."
              exit 1
            fi
          done
          echo "OK: README describes both roles"

      - name: Submission reminders (warnings only)
        run: |
          if ! grep -Eqi 'youtube\.com|youtu\.be' README.md; then
            echo "::warning::No YouTube link in README.md yet - add it before submitting."
          fi
          if [ -z "$(find docs -type f -iname '*ci*' \( -iname '*.png' -o -iname '*.jpg' \) | head -n 1)" ]; then
            echo "::warning::No CI screenshot in /docs yet - add one before submitting."
          fi
          echo "Reminder checks complete"